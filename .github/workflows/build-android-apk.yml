name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "lib/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.config.ts"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build v1.4.0 arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Check out source and native engines
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Validate JavaScript and TypeScript
        run: pnpm test && pnpm check && pnpm lint

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m' --console=plain

      - name: Package APK and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/MNN-Local-AI-1.4.0-arm64.apk
          sha256sum dist/MNN-Local-AI-1.4.0-arm64.apk > dist/SHA256SUMS-v1.4.0.txt
          ls -lh dist/MNN-Local-AI-1.4.0-arm64.apk dist/SHA256SUMS-v1.4.0.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNN-Local-AI-v1.4.0-arm64
          path: |
            dist/MNN-Local-AI-1.4.0-arm64.apk
            dist/SHA256SUMS-v1.4.0.txt
          if-no-files-found: error
          retention-days: 14
